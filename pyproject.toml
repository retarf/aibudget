[project]
name = "aibudget-cli"
version = "0.1.0"
description = "aibudget developer CLI"
requires-python = ">=3.11"
dependencies = ["click"]

[project.scripts]
cli = "aibudget_cli.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aibudget_cli"]

[tool.ruff]
target-version = "py311"
line-length = 88
# frontend/ is JavaScript; only Python lives in these trees.
src = ["backend", "aibudget_cli"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "backend/services/budget/tests",
    "backend/services/category/tests",
    "backend/services/transaction/tests",
    "backend/gateway/tests",
]
